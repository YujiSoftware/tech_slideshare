application {
    mainClass = 'tech.slideshare.crawler.Main'
}

tasks.register("deploy", Exec) {
    group = "distribution"
    dependsOn tasks.assemble

    doFirst {
        def tarFile = tasks.distTar.archiveFile.get().asFile
        if (!tarFile.exists()) {
            throw new GradleException("Tar file not found: $tarFile")
        }

        def remoteUser = "pi"
        def remoteHost = "pi"
        def remotePath = "~/tech_slideshare/SlideCrawler/"

        println "Uploading ${tarFile.name} to ${remoteUser}@${remoteHost}:${remotePath}"

        standardInput = new FileInputStream(tarFile)
        commandLine = ["ssh", "${remoteUser}@${remoteHost}", "tar -xvf - -C ${remotePath} --strip=1"]
    }
}

dependencies {
    // https://mvnrepository.com/artifact/mysql/mysql-connector-java
    implementation "mysql:mysql-connector-java:8.0.28"

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation "org.slf4j:slf4j-api:1.7.21"

    // https://mvnrepository.com/artifact/ch.qos.logback/logback-classic
    implementation "ch.qos.logback:logback-classic:1.2.9"

    // https://mvnrepository.com/artifact/org.jsoup/jsoup
    implementation "org.jsoup:jsoup:1.15.3"

    // https://mvnrepository.com/artifact/tools.jackson.core/jackson-databind
    implementation "tools.jackson.core:jackson-databind:3.0.2"

    // https://mvnrepository.com/artifact/org.apache.pdfbox/pdfbox
    implementation "org.apache.pdfbox:pdfbox:3.0.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.14.1"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
