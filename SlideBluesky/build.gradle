plugins {
    id 'java'
}

group = 'tech.slideshare'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'tech.slideshare.bluesky.Main'
}

tasks.register("deploy", Exec) {
    group "distribution"
    dependsOn tasks.assemble

    doFirst {
        def tarFile = tasks.distTar.archiveFile.get().asFile
        if (!tarFile.exists()) {
            throw new GradleException("Tar file not found: $tarFile")
        }

        def remoteUser = "pi"
        def remoteHost = "pi"
        def remotePath = "~/tech_slideshare/SlideBluesky/"

        println "Uploading ${tarFile.name} to ${remoteUser}@${remoteHost}:${remotePath}"

        standardInput = new FileInputStream(tarFile)
        commandLine = ["ssh", "${remoteUser}@${remoteHost}", "tar -xvf - -C ${remotePath} --strip=1"]
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // HTTP Client for Bluesky API
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Source: https://mvnrepository.com/artifact/com.mysql/mysql-connector-j
    implementation "com.mysql:mysql-connector-j:8.4.0"

    // HTML parsing for OGP
    implementation 'org.jsoup:jsoup:1.17.1'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation "ch.qos.logback:logback-classic:1.5.32"

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
